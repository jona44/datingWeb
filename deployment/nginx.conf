upstream daphne {
    server 127.0.0.1:8000 fail_timeout=0;
}

# HTTPS server (Cloudflare connects here when SSL/TLS is Full)
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name 102.208.228.164 lovebyte.online www.lovebyte.online loveplus.online www.loveplus.online getloveplus.online www.getloveplus.online _;

    ssl_certificate /etc/letsencrypt/live/lovebyte.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lovebyte.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20M;

    # Static files
    location /static/ {
        alias /var/www/dating/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Media files
    location /media/ {
        alias /var/www/dating/media/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # Proxy to Daphne (Channels WebSockets & HTTP)
    location / {
        proxy_pass http://daphne;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 86400;
    }
}

# HTTP server (ACME challenge, Cloudflare Flexible, direct IP)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 102.208.228.164 lovebyte.online www.lovebyte.online loveplus.online www.loveplus.online getloveplus.online www.getloveplus.online _;

    location /.well-known/acme-challenge/ {
        root /var/www/dating;
    }

    client_max_body_size 20M;

    location /static/ {
        alias /var/www/dating/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location /media/ {
        alias /var/www/dating/media/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    location / {
        proxy_pass http://daphne;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}
